<style>
:root{
  --ink:#17211d;
  --paper:#ede8db;
  --card:#f7f3e9;
  --lacquer:#a3271f;
  --lacquer-soft:#c04a3f;
  --brass:#b0842f;
  --jade:#17211d;
  --jade-soft:#17211d;
  --muted:#6f6a5c;
  --line:rgba(23,33,29,.14);
  --shadow:0 1px 2px rgba(23,33,29,.06),0 12px 30px rgba(23,33,29,.10);
  --r:18px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--ink);min-height:100dvh;overflow-x:hidden}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-weight:400;line-height:1.45;min-height:100dvh;overflow-x:hidden;max-width:100%;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:calc(var(--safe-t) + 22px) 20px calc(var(--safe-b) + 40px)}

/* ---------- screens ---------- */
.screen{display:none;animation:fade .35s ease both}
.screen.active{display:block}
#category.active{display:flex;flex-direction:column;min-height:calc(100dvh - var(--safe-t) - var(--safe-b) - 62px)}
#quiz.active{display:flex;flex-direction:column;min-height:calc(100dvh - var(--safe-t) - var(--safe-b) - 62px)}
.quiz-foot{margin-top:auto}
.quit-btn{display:block;width:fit-content;margin:14px auto 0;background:transparent;color:var(--muted);font-weight:600;font-size:15px;padding:12px 22px}
.quit-btn:active{color:var(--ink)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}*{animation-duration:.001ms!important}}

/* ---------- masthead ---------- */
.mast{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1.title{font-size:clamp(40px,12vw,62px);font-weight:800;letter-spacing:-.02em;line-height:.95;margin:0}
h1.title .vi{color:var(--lacquer)}
.subtitle{color:var(--muted);font-size:15px;font-weight:500;margin:6px 0 0}
.subtitle-sec{color:var(--muted);font-size:13px;font-weight:500;margin:2px 0 0;opacity:.9}
.total{color:var(--muted);font-size:12.5px;font-weight:700;margin:14px 0 8px;text-align:right}
.lang{position:relative}
.toptools{position:fixed;top:calc(var(--safe-t) + 14px);right:calc(env(safe-area-inset-right,0px) + 20px);z-index:60;display:flex;align-items:center;gap:8px}
.tool-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;background:var(--card);border:1px solid var(--line);border-radius:999px;color:var(--ink);box-shadow:var(--shadow)}
.tool-btn:active{transform:scale(.95)}
.lang-btn{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--ink);box-shadow:var(--shadow)}
.lang-btn .caret{color:var(--muted);font-size:11px;transition:transform .15s ease}
.lang-btn.open .caret{transform:rotate(180deg)}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:40;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:160px}
.lang-menu[hidden]{display:none}
.lang-menu button{text-align:left;padding:10px 13px;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.lang-menu button.sel{background:var(--ink);color:var(--paper)}

/* ---------- category grid ---------- */
.rule{height:1.5px;background:var(--line);margin:2px 0 20px;border:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.surprise{grid-column:1 / -1;position:relative;text-align:left;background:var(--lacquer);color:#fdf6ec;border-radius:20px;padding:18px 20px;overflow:hidden;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.surprise:active{transform:scale(.99)}
.sp-eye{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.82;padding-right:40px}
.sp-main{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:2px;padding-right:8px}
.sp-desc{font-size:12px;font-weight:600;opacity:.9;padding-right:8px;margin-top:3px}
.sp-sub{font-size:11px;opacity:.68;font-weight:500;padding-right:52px;margin-top:2px}
.sp-ico{position:absolute;right:4px;top:4px;font-size:26px;line-height:1;opacity:.95;background:transparent;border:0;color:inherit;padding:10px;cursor:pointer}
.sp-ico:active{opacity:1}
.sp-ico.rolling{animation:spin .42s ease}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.cat{
  text-align:left;background:var(--card);border-radius:var(--r);padding:16px 15px 14px;
  box-shadow:var(--shadow);border:1px solid rgba(23,33,29,.05);
  display:flex;flex-direction:column;justify-content:space-between;min-height:104px;
  transition:transform .16s ease, box-shadow .16s ease;position:relative;overflow:hidden;
}
.cat:active{transform:scale(.97)}
.cat .idx{font-size:12px;font-weight:700;color:var(--brass);letter-spacing:.08em}
.cat .nm{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-top:4px;line-height:1.15}
.cat .nm-sec{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px;line-height:1.15}
.cat .n{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:8px}

/* ---------- category detail ---------- */
.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:600;font-size:15px;padding:6px 0;margin-bottom:6px}
.back:active{color:var(--ink)}
.detail-head{margin:10px 0 6px}
.detail-head h2{font-size:clamp(30px,8vw,44px);font-weight:800;letter-spacing:-.02em;margin:0}
.detail-head p{color:var(--muted);font-weight:500;margin:4px 0 0}
.section-label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin:28px 0 12px}
.dirswap{
  width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  padding:20px 18px;box-shadow:var(--shadow);transition:transform .12s ease;
}
.dirswap:active{transform:scale(.98)}
.dirswap .lg{font-size:clamp(15px,4.6vw,21px);font-weight:800;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dirswap #dirFrom{text-align:right}
.dirswap #dirTo{text-align:left}
.dirswap .swap{justify-self:center;flex:none;width:42px;height:42px;border-radius:50%;background:var(--brass);color:#fff;display:flex;align-items:center;justify-content:center}
.dirswap .swap svg{width:22px;height:22px}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{
  background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:9px 15px;font-weight:600;font-size:14px;
  transition:all .15s ease;
}
.chip.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:active{transform:scale(.96)}
.start{
  margin-top:auto;width:100%;background:var(--lacquer);color:#fdf6ec;font-weight:700;font-size:19px;
  border-radius:var(--r);padding:18px;transition:transform .15s ease, background .15s ease;
}
.start:active{transform:scale(.98);background:#8f2019}

/* ---------- quiz ---------- */
.qbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;padding-right:150px}
.progress{flex:1;height:6px;background:rgba(23,33,29,.10);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--jade);border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.qcount{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qclose{font-size:22px;color:var(--muted);line-height:1;padding:4px 6px}

.flash{
  background:var(--card);border-radius:24px;box-shadow:var(--shadow);
  padding:34px 26px;min-height:340px;display:flex;flex-direction:column;
  border:1px solid rgba(23,33,29,.05);position:relative;overflow:hidden;
}
.side-label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.prompt-zone{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 0}
.practice{position:relative;margin-top:20px}
.practice-in{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);padding:12px 44px 12px 15px;font-family:inherit;font-size:17px;font-weight:600;color:var(--ink)}
.practice-in::placeholder{color:var(--muted);font-weight:500;opacity:.7}
.practice-in:focus{outline:none;border-color:var(--ink)}
.practice-in.ok{border-color:var(--brass);background:rgba(176,132,47,.10)}
.practice-in.no{border-color:var(--lacquer);background:rgba(163,39,31,.07)}
.practice-mark{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:800;font-size:20px;line-height:1}
.practice-mark.ok{color:var(--brass)}
.practice-mark.no{color:var(--lacquer)}
.word{font-size:clamp(30px,9vw,46px);font-weight:800;letter-spacing:-.02em;line-height:1.1;word-break:break-word}
.word.vi{color:var(--jade)}
.word-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.speak{
  flex:none;width:52px;height:52px;border-radius:50%;background:var(--brass);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(176,132,47,.32);
  transition:transform .12s ease;
}
.speak:active{transform:scale(.9)}
.speak svg{width:24px;height:24px}
.speak.playing{animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

.answer{border-top:1.5px dashed var(--line);margin-top:auto;padding-top:22px;animation:reveal .4s ease both}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.answer .word{font-size:clamp(26px,7.5vw,40px)}
.example{margin-top:16px;background:rgba(23,33,29,.05);border-radius:14px;padding:13px 15px;display:flex;flex-direction:column;gap:10px}
.ex-row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.ex-row .ex-main{flex:1;font-weight:600;color:var(--ink);line-height:1.35}
.ex-row .ex-tag{flex:none;align-self:flex-start;background:rgba(163,39,31,.10);color:var(--lacquer);border-radius:12px;padding:6px 10px;font-weight:600;font-size:13.5px;max-width:48%;text-align:right;line-height:1.3}

.reveal-btn{
  margin-top:26px;width:100%;background:var(--ink);color:var(--paper);font-weight:700;font-size:18px;
  border-radius:var(--r);padding:17px;transition:transform .15s ease;
}
.reveal-btn:active{transform:scale(.98)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.grade button{border-radius:var(--r);padding:16px;font-weight:700;font-size:16px;transition:transform .15s ease}
.grade button:active{transform:scale(.97)}
.grade .again{background:rgba(163,39,31,.12);color:var(--lacquer)}
.grade .knew{background:var(--jade);color:#f3f8f5}

/* ---------- result ---------- */
.result{text-align:center;padding-top:20px}
.score-ring{font-size:clamp(56px,18vw,92px);font-weight:800;color:var(--lacquer);letter-spacing:-.03em;line-height:1}
.score-ring small{display:block;font-size:16px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:6px}
.result h2{font-size:26px;font-weight:800;margin:20px 0 6px}
.result p{color:var(--muted);font-weight:500;margin:0 0 28px}
.result .actions{display:flex;flex-direction:column;gap:12px;max-width:340px;margin:6px auto 24px}
.res-retry{width:100%;margin-top:14px;background:var(--lacquer);color:#fdf6ec;font-weight:700;font-size:16px;border-radius:var(--r);padding:14px}
.res-retry:active{transform:scale(.98)}
#resSummary{max-width:460px;margin:26px auto 30px;text-align:left;display:flex;flex-direction:column;gap:22px;width:100%}
#resSummary:empty{display:none}
.sum-head{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.sum-head.bad{color:var(--lacquer)}
.sum-head.good{color:var(--brass)}
.sum-row{display:flex;justify-content:space-between;gap:16px;padding:9px 2px;border-bottom:1px solid var(--line)}
.sum-vi{font-weight:700;color:var(--ink)}
.sum-en{color:var(--muted);text-align:right}
.result .actions button{border-radius:var(--r);padding:16px;font-weight:700;font-size:17px}
.result .redo{background:var(--lacquer);color:#fdf6ec}
.result .other{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

.stats-title{font-size:clamp(30px,9vw,42px);font-weight:800;letter-spacing:-.02em;margin:2px 0 20px}
.stats-title .vi{color:var(--lacquer)}
.st-section{margin:0 0 30px}
.st-q{font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--lacquer);margin:0 0 14px;display:flex;gap:8px;align-items:baseline}
.st-q b{font-size:15px}
.st-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow)}
.st-card .k{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.st-card .v{font-size:26px;font-weight:800;letter-spacing:-.01em;margin-top:4px;line-height:1.05}
.st-card .v small{font-size:14px;font-weight:600;color:var(--muted)}
.st-bar{height:9px;border-radius:99px;background:rgba(23,33,29,.10);overflow:hidden;margin-top:10px}
.st-bar i{display:block;height:100%;border-radius:99px;background:var(--lacquer)}
.st-chart{display:flex;align-items:flex-end;gap:7px;height:120px;margin-top:6px;padding:10px 2px 0}
.st-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.st-chart .bar{width:100%;max-width:34px;background:var(--brass);border-radius:6px 6px 0 0;min-height:3px;transition:height .3s ease}
.st-chart .dl{font-size:10.5px;color:var(--muted);font-weight:600}
.st-mastery{display:flex;flex-direction:column;gap:12px}
.st-mrow{display:flex;align-items:center;gap:12px}
.st-dot{width:11px;height:11px;border-radius:50%;flex:none}
.st-dot.m{background:#2f8f5b}.st-dot.l{background:var(--brass)}.st-dot.r{background:var(--lacquer)}
.st-mrow .lbl{font-weight:600;font-size:14px;flex:none;width:112px}
.st-mrow .track{flex:1;height:10px;background:rgba(23,33,29,.08);border-radius:99px;overflow:hidden}
.st-mrow .track i{display:block;height:100%;border-radius:99px}
.st-mrow .track i.m{background:#2f8f5b}.st-mrow .track i.l{background:var(--brass)}.st-mrow .track i.r{background:var(--lacquer)}
.st-mrow .num{font-weight:800;font-variant-numeric:tabular-nums;width:42px;text-align:right}
.st-cat{display:flex;flex-direction:column;gap:10px}
.st-catrow{display:flex;align-items:center;gap:12px;font-size:14px}
.st-catrow .cn{flex:none;width:120px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-catrow .track{flex:1;height:8px;background:rgba(23,33,29,.08);border-radius:99px;overflow:hidden}
.st-catrow .track i{display:block;height:100%;background:var(--ink);border-radius:99px}
.st-catrow .pc{font-weight:700;width:44px;text-align:right;color:var(--muted)}
.st-list{display:flex;flex-direction:column}
.st-listrow{display:flex;justify-content:space-between;gap:14px;padding:9px 2px;border-bottom:1px solid var(--line)}
.st-listrow .wv{font-weight:700}
.st-listrow .we{color:var(--muted);text-align:right}
.st-listrow .wx{color:var(--lacquer);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.st-review{width:100%;background:var(--lacquer);color:#fdf6ec;font-weight:700;font-size:17px;border-radius:var(--r);padding:16px;margin-top:6px}
.st-review:active{transform:scale(.98)}
.st-review[disabled]{background:var(--card);color:var(--muted);box-shadow:var(--shadow)}
.st-fun{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st-fun .f{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.st-fun .f .fv{font-size:20px;font-weight:800}
.st-fun .f .fk{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.st-empty{color:var(--muted);font-size:14px;padding:8px 0}
.st-set-label{font-size:14px;font-weight:600;margin:0 0 10px}
.st-note{color:var(--muted);font-size:12.5px;margin:12px 0 0;line-height:1.45}
.st-reset{width:100%;margin-top:22px;background:transparent;border:1.5px solid var(--lacquer);color:var(--lacquer);font-weight:700;font-size:15px;border-radius:var(--r);padding:14px}
.st-reset:active{background:rgba(163,39,31,.06)}
#featuredHost{margin-bottom:14px}
.search{position:relative;display:flex;align-items:center;margin-bottom:12px}
.search-ico{position:absolute;left:14px;color:var(--muted);display:flex}
.search-in{width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:13px 40px 13px 42px;font-family:inherit;font-size:16px;font-weight:500;color:var(--ink);box-shadow:var(--shadow)}
.search-in:focus{outline:none;border-color:var(--ink)}
.search-in::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.search-clear{position:absolute;right:8px;width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}
.search-results{display:flex;flex-direction:column;margin-bottom:12px}
.sr-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:2px 4px 8px}
.sr-dir{font-size:11px;font-weight:800;color:var(--lacquer);white-space:nowrap;padding:5px 10px;border:1px solid var(--line);border-radius:999px;text-transform:none;letter-spacing:0;background:var(--card)}
.sr-dir:active{background:rgba(163,39,31,.06)}
.sr-row{display:flex;align-items:baseline;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.sr-vi{font-size:18px;font-weight:800;color:var(--ink);flex:none}
.sr-en{font-size:14px;color:var(--muted);flex:1;min-width:0}
.sr-cat{font-size:11px;font-weight:700;color:var(--brass);letter-spacing:.02em;white-space:nowrap;flex:none}
.sr-empty{color:var(--muted);font-size:14px;padding:12px 4px}
.clue-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.cluesbtn{background:transparent;border:1.5px solid var(--brass);color:var(--brass);font-weight:700;border-radius:var(--r);padding:12px 3px;font-size:12px}
.cluesbtn:active{background:rgba(176,132,47,.10)}
.clues-pre{width:100%;margin-top:12px}
.good-toast{position:fixed;transform:translate(-50%,-100%) scale(.9);z-index:210;font-size:26px;line-height:1;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:opacity .18s ease,transform .18s ease;pointer-events:none}
.good-toast.show{opacity:1;transform:translate(-50%,-110%) scale(1)}
.clues-toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(10px);z-index:200;background:var(--card);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.28);padding:14px 16px;width:min(86vw,340px);opacity:0;transition:opacity .2s ease,transform .2s ease;pointer-events:none;cursor:pointer}
.clues-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ct-head{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:8px;text-align:center}
.ct-opt{font-size:18px;font-weight:600;color:var(--ink);padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.ct-opt:last-child{border-bottom:0}
.chip.chip-see{border-color:var(--brass);color:var(--brass)}
.words-modal{position:fixed;inset:0;z-index:300;background:rgba(23,33,29,.45);display:flex;align-items:flex-end;justify-content:center}
.words-modal[hidden]{display:none}
.wm-card{background:var(--paper);width:100%;max-width:520px;max-height:85vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.wm-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);font-size:18px;font-weight:800;color:var(--ink)}
.wm-close{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:16px;flex:none}
.wm-list{overflow-y:auto;padding:6px 18px 24px}
.wm-row{display:flex;justify-content:space-between;gap:16px;padding:11px 2px;border-bottom:1px solid var(--line)}
.wm-ex{padding:9px 2px;border-bottom:1px solid var(--line)}
.wm-ex-vi{font-weight:700;color:var(--ink);line-height:1.35}
.wm-ex-tr{color:var(--muted);font-size:14.5px;margin-top:3px;line-height:1.35}
.wm-noex{color:var(--muted);padding:12px 2px}
.wm-rowbtn{width:100%;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;font:inherit;color:inherit;align-items:center;justify-content:flex-start}
.wm-rowbtn .wm-tr{margin-left:auto;text-align:right;padding-left:12px}
.wm-rowbtn .wm-chev{flex:0 0 auto;color:var(--muted);font-size:18px;margin-left:10px}
.wm-rowbtn:active{background:rgba(0,0,0,.05)}
.wm-back{background:none;border:0;color:inherit;font-size:24px;line-height:1;cursor:pointer;padding:0 10px 0 0;vertical-align:middle}
.wm-vi{font-weight:700;color:var(--ink)}
.wm-tr{color:var(--muted);text-align:right}
.foot{text-align:center;color:var(--muted);font-size:12.5px;font-weight:500;margin-top:34px;opacity:.8}
.foot .ver{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:600;opacity:.85}
</style>

function detectLang(){
  const raw = (navigator.language || (navigator.languages && navigator.languages[0]) || "en").toLowerCase();
  const code = raw.split("-")[0];
  if(code === "vi") return "en";                       // téléphone en vietnamien → app en anglais
  return APP_LANGS.indexOf(code) >= 0 ? code : "en";    // sinon langue du téléphone, ou anglais par défaut
}
function initialLang(){
  return detectLang(); // toujours la langue du système du téléphone
}

function T(){ return UI[secLang] || UI.fr; }

function applyLang(l){
  const t = UI[l] || UI.fr;
  document.querySelector('#category .back').textContent = '‹ ' + t.back;
  $("lblDir").textContent = t.dir;
  $("lblCount").textContent = t.count;
  $("lblWords").textContent = t.wordsSection;
  { const lb=$("listBtn"); if(lb) lb.textContent = t.seeAll; }
  document.querySelector('.start').textContent = t.start;
  $("revealBtn").textContent = t.reveal;
  document.querySelector('#gradeBox .again').textContent = t.again;
  document.querySelector('#gradeBox .knew').textContent = t.knew;
  document.querySelectorAll(".c-first").forEach(b=>b.textContent = t.firstLetter);
  document.querySelectorAll(".c-second").forEach(b=>b.textContent = t.secondLetter);
  document.querySelectorAll(".c-third").forEach(b=>b.textContent = t.thirdLetter);
  document.querySelectorAll(".c-clues").forEach(b=>b.textContent = t.clues);
  $("quitBtn").textContent = t.quit;
  { const rr=document.querySelector('#result .redo'); if(rr) rr.textContent = t.redo; }
  { const ro=document.querySelector('#result .other'); if(ro) ro.textContent = t.other; }
  document.querySelector('.qclose').setAttribute('aria-label', t.close);
  $("promptSpeak").setAttribute('aria-label', t.listen);
  $("ansSpeak").setAttribute('aria-label', t.listen);
  $("practiceInput").placeholder = t.practice;
  const si=$("searchInput"); if(si) si.placeholder = t.st.search;
}

function nmeta(c){ return CATNAMES[c.id] || {vi:c.name,en:c.name,ko:c.name}; }

function setLang(l){
  secLang = l;
  $("langCur").textContent = LANGCODE[l] || l.toUpperCase();
  document.querySelectorAll("#langMenu button").forEach(b=>b.classList.toggle("sel", b.dataset.lang===l));
  const ss = $("subSec");
  if(l!=="vi"){ ss.textContent = SUBTITLE[l]; ss.style.display=""; }
  else { ss.textContent=""; ss.style.display="none"; }
  applyLang(l);
  buildHome();
  if(state.cat){ refreshCatHead(); updateDirSwap(); buildLens(); }
  if($("quiz").classList.contains("active")) refreshQuizLabels();
  if($("result").classList.contains("active")) renderResultTexts();
  if($("stats").classList.contains("active")) renderStats();
  if($("searchInput") && $("searchInput").value.trim()) doSearch();
  { const wm=$("wordsModal"); if(wm && !wm.hidden){ if(curWordItem) showWordDetail(curWordItem, curWordFromList); else renderWords(); } }
}
/* menu déroulant de langue */
function toggleLangMenu(force){
  const m = $("langMenu");
  const show = (force===undefined) ? m.hasAttribute("hidden") : force;
  if(show){ m.removeAttribute("hidden"); $("langBtn").classList.add("open"); }
  else { m.setAttribute("hidden",""); $("langBtn").classList.remove("open"); }
}
$("langBtn").onclick = (e)=>{ e.stopPropagation(); toggleLangMenu(); };
document.querySelectorAll("#langMenu button").forEach(b=>{
  b.onclick = (e)=>{ e.stopPropagation(); try{ localStorage.setItem("ontap_lang", b.dataset.lang); }catch(err){} setLang(b.dataset.lang); toggleLangMenu(false); };
});
document.addEventListener("click", ()=>toggleLangMenu(false));

/* ---- accueil ---- */
function buildHome(){
  const total = CATEGORIES.reduce((n,c)=>n+c.items.length,0);
  $("totalTag").textContent = CATEGORIES.length + " " + T().cats + " · " + total + " từ";
  const fh = $("featuredHost");
  if(fh){ fh.innerHTML = ""; fh.appendChild(featuredEl()); }
  const grid = $("catGrid");
  grid.innerHTML = "";
  CATEGORIES.forEach((c,idx)=>{
    const nm = nmeta(c);
    const b = document.createElement("button");
    b.className = "cat";
    const sec = secLang!=="vi" ? '<div class="nm-sec">'+(nm[secLang]||nm.en)+'</div>' : '';
    const cnt = secLang!=="vi"
      ? c.items.length+' từ · '+c.items.length+' '+WORDS[secLang]
      : c.items.length+' từ';
    b.innerHTML =
      '<div class="idx">'+String(idx+1).padStart(2,"0")+'</div>'+
      '<div class="nm">'+nm.vi+'</div>'+ sec +
      '<div class="n">'+cnt+'</div>';
    b.onclick = ()=>openCategory(c.id);
    grid.appendChild(b);
  });
}

function exampleOf(item){ const t=EX_MEANINGS[secLang]; if(t && item.exEn && t[item.exEn]) return t[item.exEn]; return item.exEn || item.exVi || ""; }
function exTr(en, vi){ const t=EX_MEANINGS[secLang]; if(t && en && t[en]) return t[en]; return en || vi || ""; }
function examplesOf(item){ const a=[]; if(item.exVi || item.exEn){ a.push({vi:item.exVi||"", tr: exampleOf(item)}); } if(Array.isArray(item.exs)){ for(const e of item.exs){ a.push({vi:e.vi||"", tr: exTr(e.en, e.vi)}); } } return a; }
function cap(s){ return (s && typeof s==="string") ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function renderExamples(item){
  const box=$("exBox"); if(!box) return;
  const exs=examplesOf(item);
  if(exs.length){
    box.hidden=false;
    box.innerHTML = exs.map(function(e){
      const showTag = !!(e.vi && e.tr && e.vi!==e.tr);
      return '<div class="ex-row"><div class="ex-main">'+esc(cap(e.tr||e.vi))+'</div>'+(showTag?'<div class="ex-tag">'+esc(cap(e.vi))+'</div>':'')+'</div>';
    }).join('');
  } else { box.hidden=true; }
}
function meaningOf(item){ const t=MEANINGS[secLang]; return (t && t[item.en]) || item.en; }
function noAccent(s){ return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D"); }
function nrm(s){ return noAccent((s||"").toLowerCase()).replace(/\s+/g," ").trim(); }
function searchIndex(){
  if(SEARCH_INDEX) return SEARCH_INDEX;
  const seen=new Set(), out=[];
  CATEGORIES.forEach(c=>c.items.forEach(it=>{
    const key=it.vi+"|"+it.en;
    if(seen.has(key)) return; seen.add(key);
    out.push({vi:it.vi, en:it.en, cat:c.id, nv:nrm(it.vi), ne:nrm(it.en), exVi:it.exVi, exEn:it.exEn, exs:it.exs});
  }));
  SEARCH_INDEX=out; return out;
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++){ const cost=a[i-1]===b[j-1]?0:1; cur[j]=Math.min(cur[j-1]+1, prev[j]+1, prev[j-1]+cost); }
    const t=prev; prev=cur; cur=t;
  }
  return prev[n];
}
function scoreItem(q, it){
  let best=0;
  const tr = MEANINGS[secLang] && MEANINGS[secLang][it.en];
  const nt = tr ? nrm(tr) : "";
  for(const f of [it.nv, it.ne, nt]){
    if(!f) continue;
    if(f===q) best=Math.max(best,100);
    else if(f.indexOf(q)===0) best=Math.max(best,82);
    else if(f.indexOf(q)>=0) best=Math.max(best,64);
  }
  if(best<64 && q.length>=2){
    let dmin=99;
    [it.nv, it.ne, nt].forEach(f=>{
      if(!f) return;
      f.split(/[\s/]+/).forEach(w=>{ if(w) dmin=Math.min(dmin, lev(q,w)); });
      dmin=Math.min(dmin, lev(q, f));
    });
    if(dmin<=1) best=Math.max(best,58);
    else if(dmin===2 && q.length>=4) best=Math.max(best,48);
    else if(dmin===3 && q.length>=6) best=Math.max(best,40);
  }
  return best;
}
let searchResultItems=[]; let curWordItem=null; let wordListItems=[]; let curWordFromList=false;
function doSearch(){
  const raw=$("searchInput").value, q=nrm(raw), res=$("searchResults");
  $("searchClear").hidden = !raw;
  if(!q){ res.hidden=true; res.innerHTML=""; $("featuredHost").style.display=""; $("catGrid").style.display=""; return; }
  $("featuredHost").style.display="none"; $("catGrid").style.display="none"; res.hidden=false;
  const scored=searchIndex().map(it=>({it,s:scoreItem(q,it)})).filter(x=>x.s>0)
      .sort((a,b)=>b.s-a.s || a.it.vi.length-b.it.vi.length).slice(0,30);
  const inv=searchInvert, ln=T().enName, vn=T().viName;
  const dir='<button class="sr-dir" onclick="toggleSearchDir()">⇄ '+esc(inv ? ln+" → "+vn : vn+" → "+ln)+'</button>';
  if(!scored.length){
    res.innerHTML='<div class="sr-head"><span>'+esc(T().st.searchHead)+'</span>'+dir+'</div><p class="sr-empty">'+esc(T().st.searchNone)+'</p>';
    return;
  }
  searchResultItems = scored.map(x=>x.it);
  const rows=scored.map((x,ri)=>{
    const it=x.it, nm=CATNAMES[it.cat], catnm=nm?(nm[secLang]||nm.vi):it.cat;
    const mean=meaningOf(it);
    const primary=inv?mean:it.vi, secondary=inv?it.vi:mean;
    return '<button class="sr-row" onclick="showSearchWord('+ri+')">'
      +'<span class="sr-vi">'+esc(primary)+'</span>'
      +'<span class="sr-en">'+esc(secondary)+'</span>'
      +'<span class="sr-cat">'+esc(catnm)+'</span></button>';
  }).join("");
  res.innerHTML='<div class="sr-head"><span>'+esc(T().st.searchHead)+' · '+scored.length+'</span>'+dir+'</div>'+rows;
}
function toggleSearchDir(){ searchInvert=!searchInvert; doSearch(); }

/* ---- quiz surprise (change au lancement + toutes les 30 min) ---- */
let featured = null;
function sameFeatured(a,b){ return !!a && !!b && a.type===b.type && a.catId===b.catId; }
function pickFeatured(){
  const prev = featured;
  let next, tries = 0;
  do {
    if(Math.random() < 0.5){ next = { type:"mix" }; }
    else { next = { type:"cat", catId: CATEGORIES[Math.floor(Math.random()*CATEGORIES.length)].id }; }
    tries++;
  } while(sameFeatured(next, prev) && tries < 30);
  featured = next;
}
function featuredEl(){
  if(!featured) pickFeatured();
  const L = T().st;
  const b = document.createElement("div");
  b.className = "surprise";
  b.setAttribute("role","button");
  b.onclick = startFeatured;
  let main;
  if(featured.type==="mix"){
    main = L.surpriseMix;
  } else {
    const nm = CATNAMES[featured.catId] || {vi:featured.catId};
    main = nm.vi + (secLang!=="vi" && nm[secLang] ? "  ·  "+nm[secLang] : "");
  }
  if(!main || !String(main).trim()) main = L.surpriseMix;   // jamais de titre vide
  const desc = featured.type==="mix" ? L.surpriseSubMix : L.surpriseSubCat;
  const count = featuredCount();
  const wordsLbl = WORDS[secLang] || WORDS.en;
  b.innerHTML =
    '<span class="sp-eye">'+esc(L.surpriseTitle)+'</span>'
    + '<span class="sp-main">'+esc(main)+'</span>'
    + '<span class="sp-desc">'+esc(desc)+' · '+count+' '+esc(wordsLbl)+'</span>';
  const dice = document.createElement("button");
  dice.className = "sp-ico";
  dice.type = "button";
  dice.textContent = "🎲";
  dice.setAttribute("aria-label", L.surpriseReroll || "");
  dice.onclick = (e)=>{ e.stopPropagation(); reroll(dice); };
  b.appendChild(dice);
  return b;
}
function reroll(dice){
  if(dice) dice.classList.add("rolling");
  pickFeatured();
  setTimeout(()=>{ if($("home").classList.contains("active")) buildHome(); }, 260);
}
function featuredCount(){
  if(featured.type==="mix"){
    return Math.min(20, CATEGORIES.reduce((n,c)=>n+c.items.length,0));
  }
  const c = CATEGORIES.find(x=>x.id===featured.catId);
  return c ? Math.min(20, c.items.length) : 20;
}
function startFeatured(){
  if(!featured) pickFeatured();
  let items, catObj;
  if(featured.type==="mix"){
    const all=[];
    CATEGORIES.forEach(c=>c.items.forEach(it=>all.push({...it, _cat:c.id})));
    items = buildDeck(all, 20);
    catObj = { id:"surprise", name:"Surprise", items };
  } else {
    const c = CATEGORIES.find(x=>x.id===featured.catId) || CATEGORIES[0];
    items = buildDeck([...c.items], 20);
    catObj = { id:c.id, name:c.name, items };
  }
  state.cat = catObj;
  state.dir = Math.random()<0.5 ? "en2vi" : "vi2en";
  state.len = "all";
  startQuiz();
}

  if(!state.cat) return;
  const nm = nmeta(state.cat);
  $("catName").textContent = nm.vi;
  const n = state.cat.items.length;

/* ---- détail catégorie ---- */
function openCategory(id){
  state.cat = CATEGORIES.find(c=>c.id===id);
  state.dir = "en2vi";
  state.len = "all";
  refreshCatHead();
  // direction (bouton unique inversable)
  updateDirSwap();
  $("dirSwap").onclick = ()=>{
    state.dir = state.dir==="en2vi" ? "vi2en" : "en2vi";
    updateDirSwap();
  };
  // longueurs proposées
  buildLens();
  go("category");
}

/* ---- chips de nombre de cartes (localisés) ---- */
function buildLens(){
  if(!state.cat) return;
  const n = state.cat.items.length;
  const lens = [10,20,30,50,100,200].filter(x=>x<n);
  lens.push("all");
  if(lens.indexOf(state.len)===-1) state.len = "all";
  const box = $("lenBox"); box.innerHTML="";
  lens.forEach(v=>{
    const chip = document.createElement("button");
    chip.className = "chip" + (v===state.len?" sel":"");
    chip.textContent = v==="all" ? (T().all+" ("+n+")") : (v+" "+T().cards);
    chip.onclick = ()=>{
      state.len = v;
      box.querySelectorAll(".chip").forEach(x=>x.classList.remove("sel"));
      chip.classList.add("sel");
    };
    box.appendChild(chip);
  });
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function weightOf(item){
  // aléatoire dominant : tout le monde à poids égal…
  let w = 1;
  const st = STATS.words[wordKey(item)];
  // …sauf un léger surpoids pour les mots souvent ratés (≥2 fois), pour les revoir
  if(st && (st.wrong||0) >= 2) w += Math.min(st.wrong, 4) * 0.4;
  return w;
}
function buildDeck(items, len){
  if(len==="all" || len>=items.length) return shuffle([...items]);
  // échantillonnage aléatoire pondéré sans remise (Efraimidis–Spirakis)
  const picked = items.map(it=>({it, key: Math.pow(Math.random(), 1/weightOf(it))}))
    .sort((a,b)=>b.key-a.key).slice(0, len).map(x=>x.it);
  return shuffle(picked);
}
function showSearchWord(i){ const it=searchResultItems[i]; if(it) showWordDetail(it); }
function showWordDetail(item, fromList){

  const exs=examplesOf(item);
  let html;
  if(exs.length){
    html = exs.map(function(e){
      const showTag = !!(e.vi && e.tr && e.vi!==e.tr);
      return '<div class="wm-ex"><div class="wm-ex-vi">'+esc(cap(e.vi||e.tr))+'</div>'+(showTag?'<div class="wm-ex-tr">'+esc(cap(e.tr))+'</div>':'')+'</div>';
    }).join('');
  } else { html='<p class="wm-noex">—</p>'; }
  $("wmList").innerHTML = html;

/* ---- entraînement à l'écriture ---- */
function normWord(s){ return (s||"").toLowerCase().trim().replace(/\s+/g," "); }
function buildVariants(s){
  const out = new Set();
  s.split("/").forEach(part=>{
    // contenu entre parenthèses ignoré (ex. "Cô (giáo)" -> "cô")
    const noParen = normWord(part.replace(/\([^)]*\)/g," "));
    if(noParen) out.add(noParen);
    // parenthèses retirées mais contenu gardé (ex. "cô giáo")
    const keepInner = normWord(part.replace(/[()]/g," "));
    if(keepInner) out.add(keepInner);
  });
  return [...out];
}
function checkPractice(){
  const inp = $("practiceInput"), mark = $("practiceMark");
  const v = normWord(inp.value);
  const vars = state.ansVariants || [];
  if(v.length===0){ mark.hidden=true; inp.classList.remove("ok","no"); return; }
  const exact = vars.indexOf(v) >= 0;
  const onTrack = !exact && vars.some(w => w.indexOf(v)===0);
  if(exact){
    mark.hidden=false; mark.textContent="✓"; mark.classList.add("ok"); mark.classList.remove("no");
    inp.classList.add("ok"); inp.classList.remove("no");
    if(!state.revealed){ reveal(); requestAnimationFrame(showGood); }
  } else if(onTrack){
    mark.hidden=true; inp.classList.remove("ok","no");
  } else {
    mark.hidden=false; mark.textContent="✗"; mark.classList.add("no"); mark.classList.remove("ok");
    inp.classList.add("no"); inp.classList.remove("ok");
  }
}

/* ---- Clues : indices avec 5 propositions (une seule juste) ---- */
let cluesTimer = null;
function hideClues(){
  const t = $("cluesToast"); if(!t) return;
  t.classList.remove("show"); t.hidden = true; t.style.pointerEvents="none";
  if(cluesTimer){ clearTimeout(cluesTimer); cluesTimer=null; }
  document.removeEventListener("click", cluesOutside, true);
}
function stripOneAccent(w){
  for(let i=0;i<w.length;i++){
    if(w[i]==="đ") return w.slice(0,i)+"d"+w.slice(i+1);
    if(w[i]==="Đ") return w.slice(0,i)+"D"+w.slice(i+1);
    const d=w[i].normalize("NFD");
    if(d.length>1) return w.slice(0,i)+d[0]+w.slice(i+1);
  }
  return null;
}
function makeTypos(word, n){
  const out=[];
  const sa=stripOneAccent(word); if(sa && sa!==word) out.push(sa);
  for(let i=0;i<word.length-1;i++){ if(word[i].trim() && word[i+1].trim()) out.push(word.slice(0,i)+word[i+1]+word[i]+word.slice(i+2)); }
  for(let i=0;i<word.length;i++){ if(word[i]!==" ") out.push(word.slice(0,i)+word.slice(i+1)); }
  for(let i=0;i<word.length;i++){ if(word[i]!==" ") out.push(word.slice(0,i+1)+word[i]+word.slice(i+1)); }
  const uniq=[...new Set(out)].filter(v=>v && v!==word);
  shuffle(uniq);
  return uniq.slice(0,n);
}
function showToast(inner, ms){
  const t = $("cluesToast"); if(!t) return;
  if(!t.hidden) return;                        // déjà affiché → ne rien faire
  t.innerHTML = inner;
  t.hidden=false; t.style.pointerEvents="auto"; t.onclick=hideClues;
  requestAnimationFrame(()=>t.classList.add("show"));
  if(cluesTimer) clearTimeout(cluesTimer);
  cluesTimer=setTimeout(hideClues, ms||5000);
  setTimeout(()=>{ document.addEventListener("click", cluesOutside, true); }, 0);
}
function curAnswer(){
  const item = state.deck[state.i];

function openClues(){

    + opts.map(o=>'<div class="ct-opt">'+esc(o)+'</div>').join(""));
}

/* =====================================================================
   STATISTIQUES (données réelles, stockées sur l'appareil)
   ===================================================================== */
const STORE_KEY = "ontap_stats_v1";
let STATS = loadStats();
function loadStats(){
  try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)); if(s && s.words && s.sessions) return s; }catch(e){}
  return { words:{}, sessions:[], totalAnswered:0 };
}
function saveStats(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(STATS)); }catch(e){} }
function wordKey(it){ return it.en + "|" + it.vi; }
function dayStr(ts){ const d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function classify(w){
  const net = w.knew - w.wrong;
  if(net >= 2) return "m";               // maîtrisé
  if(w.wrong >= w.knew && w.wrong>0) return "r"; // à revoir
  return "l";                             // en apprentissage
}
function fmtDur(ms){
  const m = Math.round(ms/60000);
  if(m < 60) return m+" min";
  return Math.floor(m/60)+"h "+(m%60)+"min";
}
function computeStats(){
  const words = Object.values(STATS.words);
  const totalSeen = words.reduce((n,w)=>n+w.seen,0);
  const totalKnew = words.reduce((n,w)=>n+w.knew,0);
  const accuracy = STATS.totalAnswered ? Math.round(totalKnew/STATS.totalAnswered*100) : 0;
  let mastered=0, learning=0, review=0;
  words.forEach(w=>{ const c=classify(w); if(c==="m")mastered++; else if(c==="r")review++; else learning++; });
  const totalApp = CATEGORIES.reduce((n,c)=>n+c.items.length,0);
  const progress = totalApp ? Math.round(mastered/totalApp*100) : 0;
  const studyMs = STATS.sessions.reduce((n,s)=>n+(s.dur||0),0);
  // jours d'activité
  const days = [...new Set(STATS.sessions.map(s=>s.d))].sort();
  const today = dayStr(Date.now());
  const todayCount = STATS.sessions.filter(s=>s.d===today).length;
  const weekAgo = Date.now()-6*864e5;
  const weekSessions = STATS.sessions.filter(s=>s.ts>=weekAgo);
  // streak courant
  function streakFrom(startTs){
    let s=0, d=new Date(startTs);
    while(days.indexOf(dayStr(d.getTime()))>=0){ s++; d.setDate(d.getDate()-1); }
    return s;
  }
  let streak = streakFrom(Date.now());
  if(streak===0) streak = streakFrom(Date.now()-864e5); // pas encore joué aujourd'hui
  // plus longue série
  let longest=0, run=0, prev=null;
  days.forEach(d=>{ if(prev && (new Date(d)-new Date(prev))===864e5) run++; else run=1; longest=Math.max(longest,run); prev=d; });
  const lastTs = STATS.sessions.length ? Math.max(...STATS.sessions.map(s=>s.ts)) : 0;
  const perfect = STATS.sessions.filter(s=>s.total>0 && s.knew===s.total).length;
  const bestAcc = STATS.sessions.reduce((m,s)=> Math.max(m, s.total?Math.round(s.knew/s.total*100):0), 0);
  // par catégorie
  const catMap={};
  words.forEach(w=>{ const c=catMap[w.cat]||(catMap[w.cat]={seen:0,knew:0}); c.seen+=w.seen; c.knew+=w.knew; });
  const cats = Object.keys(catMap).map(id=>({id, acc: Math.round(catMap[id].knew/catMap[id].seen*100), seen:catMap[id].seen}))
                 .filter(c=>c.seen>=3).sort((a,b)=>b.acc-a.acc);
  // mots difficiles
  const hard = words.filter(w=>w.wrong>0).sort((a,b)=>b.wrong-a.wrong || b.seen-a.seen).slice(0,8);
  // 7 derniers jours : questions révisées / jour
  const last7=[]; for(let i=6;i>=0;i--){ const d=new Date(Date.now()-i*864e5); const ds=dayStr(d.getTime());
    const q=STATS.sessions.filter(s=>s.d===ds).reduce((n,s)=>n+s.total,0);
    last7.push({ds, q, lbl:["D","L","M","M","J","V","S"][d.getDay()===0?0:d.getDay()]}); }
  return {words, mastered, learning, review, progress, accuracy, studyMs, todayCount,
    weekCount:weekSessions.length, weekMs:weekSessions.reduce((n,s)=>n+(s.dur||0),0),
    streak, longest, lastTs, perfect, bestAcc, cats, hard, last7,
    wordsLearned:mastered, questions:STATS.totalAnswered||0};
}

  const hm = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  if(dayStr(ts)===today) return (T().st.today)+", "+hm;
  return dayStr(ts)+" "+hm;

function reviewWeak(){
  const keys = Object.values(STATS.words).filter(w=>classify(w)==="r");
  const items=[];
  keys.forEach(w=>{
    const cat = CATEGORIES.find(c=>c.id===w.cat);
    let it = cat && cat.items.find(x=>x.en===w.en && x.vi===w.vi);
    if(!it){ for(const c of CATEGORIES){ const f=c.items.find(x=>x.en===w.en && x.vi===w.vi); if(f){it=f;break;} } }
    if(it) items.push(it);
  });
  if(!items.length) return;
  state.cat = { id:"review", name:"Review", items };
  state.dir = "en2vi"; state.len = "all";
  startQuiz();

  viVoice = (voicePref && vis.find(v=>v.name===voicePref)) || vis[0] || null;
}
function setVoice(name){
  voicePref = name;
  try{ localStorage.setItem("ontap_voice", name); }catch(e){}
  pickVoice(); buildVoiceChips(); speakSample();
}
function speakSample(){
  if(!window.speechSynthesis) return;
  stopSpeak();
  const u = new SpeechSynthesisUtterance("Xin chào");
  u.lang = "vi-VN"; u.rate = .85; if(viVoice) u.voice = viVoice;
  try{ speechSynthesis.speak(u); }catch(e){}
}
function buildVoiceChips(){
  const box = $("voiceChips"); if(!box) return;
  const vis = viVoiceList();
  box.innerHTML = "";
  if(!vis.length){ box.innerHTML = '<span class="st-empty">—</span>'; return; }
  vis.forEach((v,i)=>{
    const b = document.createElement("button");
    const sel = voicePref ? v.name===voicePref : i===0;
    b.className = "chip" + (sel?" sel":"");
    b.textContent = v.name;
    b.onclick = ()=>setVoice(v.name);
    box.appendChild(b);
  });
}
function resetStats(){
  if(!confirm(T().st.resetConfirm)) return;
  STATS = { words:{}, sessions:[], totalAnswered:0 };
  saveStats();
  renderStats();
}
if(window.speechSynthesis){
  pickVoice();
  speechSynthesis.onvoiceschanged = ()=>{ pickVoice(); if($("stats") && $("stats").classList.contains("active")) buildVoiceChips(); };
}
function warmUpSpeech(){
  // iOS : il faut un premier appel déclenché par un geste pour débloquer l'audio
  if(speechReady || !window.speechSynthesis) return;
  try{
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0; speechSynthesis.speak(u); speechReady = true; pickVoice();
  }catch(e){}
}
function cleanForSpeech(t){
  return (t||"").split("/")[0].replace(/\([^)]*\)/g,"").replace(/[…?!.]+$/,"").trim();
}
function stopSpeak(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  document.querySelectorAll(".speak.playing").forEach(b=>b.classList.remove("playing"));
}
function speakCurrent(which){
  if(!window.speechSynthesis){ return; }
  const item = state.deck[state.i]; if(!item) return;
  const text = cleanForSpeech(item.vi);
  const btn = which==="prompt" ? $("promptSpeak") : $("ansSpeak");
  stopSpeak();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "vi-VN"; u.rate = .85; u.pitch = 1;
  if(viVoice) u.voice = viVoice;
  u.onstart = ()=>btn.classList.add("playing");
  u.onend = ()=>btn.classList.remove("playing");
  u.onerror = ()=>btn.classList.remove("playing");
  try{ speechSynthesis.speak(u); }catch(e){}
}

document.addEventListener("keydown", e=>{
  if(!$("quiz").classList.contains("active")) return;
  if(document.activeElement === $("practiceInput")) return; // ne pas gêner la saisie
  if(e.code==="Space"){ e.preventDefault(); if(!state.revealed) reveal(); }
  else if(state.revealed && (e.key==="1")) grade(false);
  else if(state.revealed && (e.key==="2")) grade(true);
});
